name: poll comments

# GitHub's scheduler runs at most every 5 minutes and can lag under load.
# Vercel's free cron only runs once a day, so the schedule lives here.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the bot
        env:
          POLL_URL: ${{ secrets.POLL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -H "Authorization: Bearer $(printf %s "$CRON_SECRET" | tr -d "\r\n")" "$POLL_URL")
          # only the summary goes in the log; commenter usernames stay out of it
          jq -c '.summary // .' out.json || cat out.json
          test "$code" = "200"
